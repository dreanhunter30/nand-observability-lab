name: Tests

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: read

jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ['3.10', '3.12']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Unit and CLI tests
        run: python -S -m unittest discover -s tests -v
      - name: Active benchmark
        run: python -S run_active.py
      - name: Independent active verification
        run: python -S verify_active.py
      - name: Exhaustive observability benchmark
        run: python -S run_blackbox.py
      - name: Independent exhaustive verification
        run: python -S verify_blackbox.py
